r, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">Низька кислотність, щільне тіло і смак</text><text x="20.0" y="79.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">молочного шоколаду. Базова кава для капучино й</text><text x="20.0" y="94.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">флет вайту.</text><line x1="20" y1="105" x2="284" y2="105" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="119.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">КРАЇНА</text><text x="284.0" y="119.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Бразилія</text><line x1="20" y1="125" x2="284" y2="125" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">РЕГІОН</text><text x="284.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Серрадо Мінейро</text><line x1="20" y1="145" x2="284" y2="145" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="159.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">ОБРОБКА</text><text x="284.0" y="159.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Натуральна</text><line x1="20" y1="165" x2="284" y2="165" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="179.0" font-family=