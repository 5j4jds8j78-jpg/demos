.0" y="64.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">Ягоди сушать цілими, тож зерно вбирає</text><text x="20.0" y="79.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">фруктовий цукор: полуниця на старті, чорниця й</text><text x="20.0" y="94.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" fill="#1e1a17" text-anchor="start">какао в післясмаку.</text><line x1="20" y1="105" x2="284" y2="105" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="119.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">КРАЇНА</text><text x="284.0" y="119.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Ефіопія</text><line x1="20" y1="125" x2="284" y2="125" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">РЕГІОН</text><text x="284.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Гуджі</text><line x1="20" y1="145" x2="284" y2="145" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="159.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">ОБРОБКА</text><text x="284.0" y="159.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Натуральна</text><line x1="20" y1="165" x2="284" y2="165" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="179.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">ВИСОТА</text><text x="284.0" y="179.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">2000–2300 м</text><line x1="20" y1="185" x2="284" y2="185" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="199.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">СОРТ</text><text x="284.0" y="199.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">Ефіопські хейрлум</text><line x1="20" y1="205" x2="284" y2="205" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="219.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.3">ОЦІНКА SCA</text><text x="284.0" y="219.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="500" fill="#1e1a17" text-anchor="end">88</text><line x1="20" y1="225" x2="284" y2="225" stroke="#1e1a17" stroke-width="0.6" opacity="0.35"/><text x="20.0" y="245.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="7.6" font-weight="700" fill="#79746f" text-anchor="start" letter-spacing="1.4">ЯК ЗАВАРЮВАТИ</text><text x="20.0" y="263.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1e1a17" text-anchor="start">Фільтр: 15 г кави, 250 мл води 93 °C, 3 хв.</text><text x="20.0" y="278.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" fill="#1e1a17" text-anchor="start">Еспресо: 18 г → 36 г за 27–30 с.</text><text x="20.0" y="342.0" font-family="Lora, 'Playfair Display', Georgia, 'Times New Ro